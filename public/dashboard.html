<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · NutriTrack AI</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script></head>
<body><main class="main">
<div class="top"><div class="row" style="flex:none"><button class="menu" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button><div><h1 id="hello">Hello</h1><div class="sub" id="date"></div></div></div>
<a class="btn" href="food.html">+ Quick add food</a></div>
<div class="grid g4" id="stats"></div>
<div class="grid g2" style="margin-top:16px">
 <div class="card"><div class="card-heading"><div><h2>Weekly calories</h2><div class="sub">Your daily intake over the last 7 days</div></div><a class="text-link" href="nutrition.html">View trends</a></div><div class="chart-wrap"><canvas id="week" aria-label="Weekly calories chart"></canvas><div id="weekFallback" class="week-fallback" hidden></div></div></div>
 <div class="card"><h2>Calorie goal</h2><div class="ring" id="ring"><div><span><b id="ringN">0%</b>of goal</span></div></div>
  <h2 style="margin-top:14px">Water <span class="tag" id="waterTxt"></span></h2><div class="bar"><i id="waterBar" style="width:0"></i></div>
  <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-w="250">+250 ml</button><button class="btn ghost sm" data-w="500">+500 ml</button></div></div>
</div>
<div class="grid gm" style="margin-top:16px">
 <div class="card"><h2>Today's meals</h2><div id="meals"></div></div>
 <div class="card"><h2>AI daily insight</h2><div id="insight" class="empty">Get a short, supportive note based on what you have logged today.</div><button class="btn sm" id="insightBtn" style="margin-top:10px">Generate insight</button></div>
</div></main>
<script src="js/app.js"></script><script src="js/dashboard.js"></script></body></html>
