<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Health Assistant · NutriTrack AI</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<main class="main">
  <div class="top">
    <div class="row" style="flex:none"><button class="menu" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button>
    <div><h1>AI Health Assistant</h1><div class="sub">Ask about food, meals and activity. It only knows what you have logged.</div></div></div>
  </div>

  <div class="card" style="max-width:800px">
    <div id="chat" style="min-height:300px;max-height:55vh;overflow:auto"><div class="empty">Try: "I want to build strength. Give me food and exercise tips."</div></div>
    <label class="row" style="justify-content:flex-start;gap:8px;margin-top:12px"><input id="includeExercise" type="checkbox" checked style="width:auto"><span>Include exercise tips with nutrition advice</span></label>
    <div class="row" style="margin-top:12px"><input id="msg" placeholder="Type your question…" maxlength="1000"><button class="btn" id="send">Send</button></div>
  </div>
</main>
<script src="js/app.js"></script>
<script src="js/assistant.js"></script>
</body>
</html>
