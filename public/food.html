<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Tracker · NutriTrack AI</title>
<link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script></head>
<body><main class="main">
<div class="top"><div class="row" style="flex:none"><button class="menu" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button><div><h1>Food Tracker</h1><div class="sub">Nutrition values are estimates and can be edited.</div></div></div>
<input type="date" id="day" style="width:auto"></div>
<div class="card" style="margin-bottom:16px"><div class="row"><input id="q" placeholder="Search foods (roti, dal, paneer…)" autocomplete="off"><button class="btn ghost" id="custom">+ Custom food</button></div><div class="res" id="results" hidden></div></div>
<div class="grid gm" id="sections"></div>
<div class="card" style="margin-top:16px"><h2>Day total</h2><div id="total" class="row"></div></div>
</main>
<div class="modal" id="modal"><div class="card"><h2 id="mTitle"></h2><div id="mBody"></div><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn" id="mSave">Save</button></div></div></div>
<script src="js/app.js"></script><script src="js/food.js"></script></body></html>
