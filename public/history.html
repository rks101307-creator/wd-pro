<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>History · NutriTrack AI</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<main class="main">
  <div class="top">
    <div class="row" style="flex:none"><button class="menu" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button>
    <div><h1>History</h1><div class="sub">Look back at meals, nutrition, workouts, routes and sleep.</div></div></div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="row"><input type="text" id="q" placeholder="Search food name"><select id="type"><option value="">All meals</option><option>breakfast</option><option>lunch</option><option>dinner</option><option>snack</option></select><input type="date" id="date" style="max-width:170px"></div>
      <div id="list" style="margin-top:12px"></div>
    </div>
    <div>
      <div class="card"><div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="prev">‹</button><b id="monthName"></b><button class="btn ghost sm" id="next">›</button></div><div id="cal" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;text-align:center"></div></div>
      <div class="card" style="margin-top:16px"><h2>Calories this month</h2><canvas id="monthChart" height="150"></canvas></div>
    </div>
  </div>
</main>
<script src="js/app.js"></script>
<script src="js/history.js"></script>
</body>
</html>
